<!DOCTYPE html>
<!--
  Question explorer page. NOT a thruuu-client component: a standalone page that scripts/render.py fills.
  Only the JSON block with id="qe-data" changes between runs. HTML, CSS and JS stay fixed.
  Tabs: Question tree (default), All questions, Article groups, Brands. All text goes in with textContent.

  Data block: render.py writes it. See references/sample-data.json for the input shape:
    meta   seed, country, language, device, date, creditsUsed, searchesRun, questionsFound, repeatedSkipped,
           optional view (tree | all | groups | brands), highlightBrand, plan, aioIncluded, brandsIncluded.
           Set by render.py: aioIncluded, brandsIncluded, clusterIncluded, reportIncluded, clusterCap,
           headingsDropped, brandVariants, topicBrands.
    tree   Node { q, analysed, thruuuUrl, scrapeLogId, aio (present | absent | degraded), urls, headingQuestions,
           citedQuestions, topics, topicRows, relatedSearches, relatedModifiers, brands, paa [Node | string] }
    groups, allQuestions, cluster, urlsMissing   derived by render.py
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question explorer</title>
<style>

  :root {
    --primary: #EB8F10; --primary-dark: #CA7B0E; --accent-text: #CA7B0E;
    --black: #060A15; --charcoal: #344054; --grey: #60697A; --input: #99A0AF;
    --stroke: #E4E4E7; --stroke-l1: #ECECEE; --disabled: #D6D6D6;
    --card: #FFFFFF; --page-a: #FFF9F0; --page-b: #F7F7F8;
    --tint: #FCF8F2; --tint-strong: #FFF6EB; --thead: #F9FAFC;
    --blue: #4F46E5; --blue-l: #EDECFC; --link: #4F46E5; --green: #00A44B;
    --scrim: rgba(6,10,21,0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent-text: #F2A63C; --black: #F4F5F7; --charcoal: #C9CEDA; --grey: #9AA2B2; --input: #6F7786;
      --stroke: #2E3442; --stroke-l1: #262B37; --disabled: #4A5060;
      --card: #141821; --page-a: #12151D; --page-b: #0C0E14;
      --tint: #1A1D27; --tint-strong: #2A2113; --thead: #181C26;
      --blue: #A5B4FC; --blue-l: #23243A; --link: #A5B4FC; --green: #4ADE80;
      --scrim: rgba(0,0,0,0.55);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; font-weight: 500; color: var(--black); background: linear-gradient(180deg, var(--page-a) 0%, var(--page-b) 55%); min-height: 100vh; }
  .page { max-width: 1200px; margin: 0 auto; padding: 14px 28px 24px; }
  a { color: var(--link); }
  button { font-family: inherit; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, tr:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; height: 36px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 16px 'Archivo', sans-serif; }
  .word { font-weight: 800; font-size: 1.125rem; }
  .sepv { width: 1px; height: 18px; background: var(--stroke); margin: 0 4px; }
  .surface { color: var(--grey); font-weight: 600; font-size: 0.9375rem; }
  .made { font-size: 0.8125rem; font-weight: 600; color: var(--grey); }
  .made b { color: var(--accent-text); font-weight: 800; }

  .hero { margin: 8px 0 14px; }
  h1 { margin: 0 0 4px; font-size: 1.625rem; line-height: 2.1rem; font-weight: 600; }
  h1 .seed-em { color: var(--accent-text); font-weight: 700; }
  .line { font-size: 0.875rem; line-height: 1.25rem; color: var(--grey); font-weight: 500; }
  .line + .line { margin-top: 2px; color: var(--charcoal); font-weight: 600; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--stroke); border-radius: 0.375rem; background: var(--card); padding: 2px; }
  .seg button { font: 600 0.875rem 'Manrope', sans-serif; color: var(--charcoal); background: transparent; border: 0; border-radius: 0.25rem; padding: 6px 14px; cursor: pointer; }
  .seg button.on { background: var(--tint-strong); color: var(--accent-text); font-weight: 700; }
  .btn { font: 600 0.875rem 'Manrope', sans-serif; color: var(--accent-text); background: transparent; border: 1px solid var(--accent-text); border-radius: 0.375rem; padding: 6px 14px; cursor: pointer; }
  .btn.filled { background: var(--primary-dark); border-color: var(--primary-dark); color: #fff; }
  .btn.sm { padding: 4px 10px; font-size: 0.8125rem; }

  .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 10px; box-shadow: 0px 10px 30px 0px rgba(228,228,228,0.15); overflow: hidden; margin-bottom: 12px; }
  .card h3 { margin: 0; font-size: 1.125rem; line-height: 1.6rem; font-weight: 600; }
  .card p.sub { margin: 2px 0 0; color: var(--charcoal); font-size: 0.875rem; line-height: 1.25rem; }
  .chead { padding: 12px 22px 10px; }
  .legend { margin: 6px 0 0; font-size: 0.75rem; line-height: 1.1rem; color: var(--grey); }

  /* shared marks */
  .aio { display: inline-block; font-size: 0.625rem; font-weight: 700; letter-spacing: 0.02em; color: var(--blue); background: var(--blue-l); border-radius: 0.25rem; padding: 1px 5px; line-height: 1rem; vertical-align: middle; white-space: nowrap; }
  .tag { display: inline-block; font-size: 0.6875rem; font-weight: 600; color: var(--charcoal); border: 1px solid var(--stroke); border-radius: 0.25rem; padding: 1px 6px; line-height: 1rem; vertical-align: middle; white-space: nowrap; }
  .muted { color: var(--grey); }
  .notice { font-size: 0.8125rem; line-height: 1.2rem; color: var(--charcoal); padding: 10px 22px 12px; border-top: 1px solid var(--stroke-l1); }

  /* ===== Article groups (variant C: plan table) ===== */
  .gnum { display: inline-block; min-width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 6px; background: var(--tint-strong); color: var(--accent-text); font: 700 0.8125rem 'Archivo', sans-serif; }
  table.plan { width: 100%; border-collapse: collapse; }
  .plan th { background: var(--thead); font-size: 0.75rem; font-weight: 700; color: var(--charcoal); text-align: left; padding: 0 14px; height: 34px; border-top: 1px solid var(--stroke-l1); border-bottom: 1px solid var(--stroke-l1); white-space: nowrap; }
  .plan td { padding: 10px 14px; border-bottom: 1px solid var(--stroke-l1); font-size: 0.875rem; line-height: 1.25rem; vertical-align: top; }
  .plan th.n, .plan td.n { text-align: right; }
  .plan th.first, .plan td.first { padding-left: 22px; width: 24px; }
  .plan th.last, .plan td.last { padding-right: 22px; text-align: right; white-space: nowrap; }
  .plan tr.main { cursor: pointer; }
  .plan tr.main.open td { background: var(--tint); border-bottom: 0; }
  .plan .lead { font-weight: 600; display: inline-flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .plan .more { display: block; font-size: 0.75rem; color: var(--grey); margin-top: 2px; line-height: 1.1rem; }
  .plan td.q { white-space: nowrap; color: var(--charcoal); }
  .plan tr.x td { padding: 0; background: var(--tint); }
  .xband { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; padding: 0 22px 14px 60px; }
  .xband h4 { margin: 10px 0 4px; font-size: 0.75rem; line-height: 1rem; font-weight: 600; color: var(--grey); }
  .xband ul { list-style: none; margin: 0; padding: 0; }
  .xband li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 0.8125rem; line-height: 1.2rem; padding: 2px 0; }
  .xband li .c { color: var(--grey); font-weight: 600; white-space: nowrap; font-size: 0.75rem; }
  .xband li.leaf { color: var(--grey); }
  .xband .gq { display: inline-flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .xband p { margin: 0; font-size: 0.8125rem; line-height: 1.2rem; }
  .why { color: var(--grey); font-size: 0.75rem; line-height: 1.1rem; margin-top: 8px; }
  .xband p.why { margin: 0 0 4px; }
  .xband .links { margin-top: 10px; font-size: 0.8125rem; font-weight: 600; }
  .xband .links a { text-decoration: none; }
  .x .brief { padding-left: 60px; }

  /* brief hand-off box (shared) */
  .brief { border-top: 1px solid var(--stroke-l1); background: var(--tint); padding: 12px 22px 16px; }
  .brief h4 { margin: 0 0 2px; font-size: 0.9375rem; font-weight: 600; }
  .brief p.s { margin: 0 0 10px; font-size: 0.8125rem; line-height: 1.2rem; color: var(--charcoal); }
  .brief .pick { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; }
  .brief .pick label { display: flex; align-items: baseline; gap: 8px; font-size: 0.875rem; line-height: 1.25rem; cursor: pointer; }
  .brief .pick input { accent-color: var(--primary-dark); margin: 0; position: relative; top: 2px; }
  .brief .pick .lead { margin-left: 6px; font-size: 0.6875rem; font-weight: 600; color: var(--accent-text); }
  .brief .step { font-size: 0.75rem; font-weight: 700; color: var(--grey); margin: 8px 0 4px; }
  .brief textarea { width: 100%; resize: none; font: 500 0.8125rem/1.2rem 'Manrope', sans-serif; color: var(--black); background: var(--card); border: 1px solid var(--stroke); border-radius: 0.375rem; padding: 10px 12px; }
  .brief .row2 { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .brief .hint { font-size: 0.75rem; color: var(--grey); }

  /* ===== Question tree (shared) ===== */
  ul.ol { list-style: none; margin: 0; padding: 0; }
  ul.ol ul.ol { margin-left: 28px; display: none; }
  li.open > ul.ol { display: block; }
  .row { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: center; padding: 6px 22px 6px 16px; }
  .row.lv0 { padding-top: 8px; padding-bottom: 8px; border-top: 1px solid var(--stroke-l1); }
  .chev { width: 22px; height: 22px; border: 0; background: none; color: var(--grey); padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; }
  .chev svg { transition: transform .15s; }
  li.open > .row .chev svg { transform: rotate(90deg); }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--disabled); margin: 0 auto; }
  .q { font-size: 0.9375rem; line-height: 1.3rem; font-weight: 500; color: var(--black); }
  .q.btnlike { background: none; border: 0; padding: 3px 8px; margin: -3px -8px; width: calc(100% + 16px); border-radius: 6px; text-align: left; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--black); font: inherit; }
  .q.btnlike .qt { display: inline-flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .kids { flex: none; color: var(--grey); font-size: 0.75rem; font-weight: 700; white-space: nowrap; min-width: 18px; text-align: right; }
  li.open > .row .kids { visibility: hidden; }
  .lv0 .q { font-size: 1.0625rem; font-weight: 700; }
  .lv1 .q { font-weight: 600; }
  .leaf .q { font-size: 0.875rem; color: var(--grey); }
  .row.sel .q.btnlike { background: var(--tint-strong); }
  .row.sel .q { font-weight: 700; }

  .split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  .panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .panel .phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 22px 10px; }
  .panel .phead h3 { font-size: 1.0625rem; line-height: 1.5rem; }
  .pclose { flex: none; width: 28px; height: 28px; border: 0; background: none; color: var(--grey); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pempty { padding: 28px 22px 32px; border-top: 1px solid var(--stroke-l1); text-align: center; }
  .pempty .t { font-size: 0.9375rem; font-weight: 600; margin: 0 0 4px; }
  .pempty .s { font-size: 0.8125rem; line-height: 1.2rem; color: var(--grey); margin: 0; }
  .detail { padding: 6px 22px 16px; border-top: 1px solid var(--stroke-l1); }
  .detail h4 { margin: 16px 0 4px; font-size: 0.75rem; line-height: 1rem; font-weight: 600; color: var(--grey); }
  .detail h4:first-child { margin-top: 6px; }
  .detail ul { list-style: none; margin: 0; padding: 0; }
  .detail li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.8125rem; line-height: 1.2rem; color: var(--black); padding: 2px 0; }
  .detail li .c { color: var(--grey); font-weight: 600; white-space: nowrap; }
  .detail p { margin: 0; font-size: 0.8125rem; line-height: 1.2rem; color: var(--black); }
  .detail p.mods { color: var(--charcoal); margin-bottom: 4px; }
  .detail .empty { font-size: 0.8125rem; color: var(--grey); }
  .detail .links { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .detail .links a, .detail .links button { font: 600 0.8125rem 'Manrope', sans-serif; color: var(--link); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
  .scrim { display: none; }

  /* ===== Brands (shared) ===== */
  .rhead, .rrow { display: grid; grid-template-columns: 28px 170px minmax(0, 1fr) 80px 96px; align-items: center; column-gap: 14px; padding: 0 22px; }
  .rhead { height: 30px; border-top: 1px solid var(--stroke-l1); border-bottom: 1px solid var(--stroke-l1); font-size: 0.75rem; font-weight: 700; color: var(--charcoal); background: var(--thead); }
  .rhead .n, .rrow .n { text-align: right; }
  .rrow { min-height: 36px; border-bottom: 1px solid var(--stroke-l1); font-size: 0.875rem; cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--black); }
  .rrow.own { cursor: default; background: var(--tint); }
  .rk { color: var(--grey); font-weight: 600; font-size: 0.8125rem; }
  .nm { font-weight: 600; }
  .nm .tag { margin-left: 6px; }
  .bar { height: 5px; border-radius: 3px; background: var(--stroke-l1); }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--primary); }
  .rrow.own .bar i { background: var(--disabled); }
  .rrow.sel .nm { font-weight: 800; }
  .bdetail { padding: 8px 22px 14px; border-bottom: 1px solid var(--stroke-l1); font-size: 0.8125rem; line-height: 1.2rem; }
  .bdetail h4 { margin: 0 0 4px; font-size: 0.75rem; color: var(--grey); font-weight: 600; }
  .bdetail ul { margin: 0; padding: 0; list-style: none; }
  .bdetail li { padding: 1px 0; }
  .own-note { padding: 8px 22px 14px; font-size: 0.75rem; color: var(--grey); line-height: 1.1rem; }

  .foot { font-size: 0.75rem; color: var(--grey); font-weight: 600; margin-top: 4px; }

  @media (max-width: 1000px) {
    .split { grid-template-columns: minmax(0, 1fr) 320px; }
    .rhead, .rrow { grid-template-columns: 24px 120px minmax(0, 1fr) 60px 80px; }
    .plan .hm2 { display: none; }
  }
  @media (max-width: 760px) {
    .page { padding: 12px 14px 20px; }
    .split { grid-template-columns: minmax(0, 1fr); }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 60vh; border-radius: 14px 14px 0 0; margin: 0; z-index: 11; box-shadow: 0 -10px 30px rgba(0,0,0,0.12); }
    .split:not(.has-sel) .panel { display: none; }
    .split.has-sel .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 10; border: 0; padding: 0; }
    ul.ol ul.ol { margin-left: 14px; }
    .row { padding: 6px 12px 6px 8px; column-gap: 4px; }
    .chead, .notice, .brief, .own-note, .bdetail { padding-left: 14px; padding-right: 14px; }
    .plan .hm, .plan .hm2 { display: none; }
    .plan th.first, .plan td.first { padding-left: 14px; }
    .plan th.last, .plan td.last { padding-right: 14px; }
    .plan td { padding: 8px 10px; }
    .xband { grid-template-columns: minmax(0, 1fr); padding: 0 14px 14px 14px; }
    .x .brief { padding-left: 14px; }
    .rhead .bar, .rrow .bar, .rhead span:last-child, .rrow span:last-child { display: none; }
    .rhead, .rrow { grid-template-columns: 20px minmax(0, 1fr) 44px; padding: 0 12px; }
  }

  /* next step box + all questions */
  .next { border-top: 1px solid var(--stroke-l1); background: var(--tint); padding: 12px 22px 16px; }
  .next h4 { margin: 0 0 2px; font-size: 0.9375rem; font-weight: 600; }
  .next p.s { margin: 0 0 8px; font-size: 0.8125rem; line-height: 1.2rem; color: var(--charcoal); }
  .next textarea { width: 100%; resize: vertical; font: 500 0.8125rem/1.2rem 'Manrope', sans-serif; color: var(--black); background: var(--card); border: 1px solid var(--stroke); border-radius: 0.375rem; padding: 10px 12px; }
  .next .row2 { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .next .hint { font-size: 0.75rem; color: var(--grey); }
  .aq { display: grid; grid-template-columns: minmax(0, 1fr) 52px 210px; column-gap: 14px; align-items: baseline; padding: 6px 22px; border-bottom: 1px solid var(--stroke-l1); font-size: 0.875rem; line-height: 1.25rem; }
  .aq.head { height: 30px; align-items: center; background: var(--thead); border-top: 1px solid var(--stroke-l1); font-size: 0.75rem; font-weight: 700; color: var(--charcoal); padding-top: 0; padding-bottom: 0; }
  .aq .n { text-align: right; font-weight: 700; color: var(--grey); }
  .aq .src { color: var(--grey); font-size: 0.75rem; }
  .qlinks { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .qlinks a, .qlinks button { font: 600 0.8125rem 'Manrope', sans-serif; color: var(--link); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
  .bdetail li { display: block; }
  @media (max-width: 760px) {
    .aq { grid-template-columns: minmax(0, 1fr) 40px; padding: 6px 14px; }
    .aq .src { display: none; }
    .next { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><span class="mark">t</span><span class="word">thruuu</span><span class="sepv"></span><span class="surface">Question explorer</span></div>
    <div class="made">Made with <b>thruuu</b></div>
  </header>

  <section class="hero">
    <h1>Question explorer for <span class="seed-em" id="seed"></span></h1>
    <div class="line" id="meta"></div>
    <div class="line" id="stats"></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="seg" role="tablist">
      <button data-v="tree" role="tab">Question tree</button>
      <button data-v="all" role="tab">All questions</button>
      <button data-v="groups" role="tab">Article groups</button>
      <button data-v="brands" role="tab">Brands</button>
    </div>
    <button class="btn" id="expand">Expand all</button>
    <button class="btn" id="collapse">Collapse all</button>
  </div>

  <div class="split" id="split">
    <div>
      <section class="card" id="qcard">
        <div class="chead">
          <h3>Question tree</h3>
          <p class="sub">Click a question to see its details. Arrows open or close the questions under it.</p>
          <p class="legend" id="treeLegend"></p>
        </div>
        <ul class="ol" id="outline" role="tree"></ul>
        <div id="treeNext"></div>
      </section>
    </div>
    <button class="scrim" id="scrim" aria-label="Close details" tabindex="-1"></button>
    <aside class="card panel" id="panel" role="region" aria-label="Question details"></aside>
  </div>

  <section class="card" id="acard" hidden>
    <div class="chead">
      <h3 id="aTitle">All questions</h3>
      <p class="sub" id="aSub"></p>
      <p class="legend" id="aLegend"></p>
    </div>
    <div id="alist"></div>
    <div id="aNext"></div>
  </section>

  <section class="card" id="gcard" hidden>
    <div class="chead">
      <h3 id="gTitle">Article groups</h3>
      <p class="sub" id="gSub"></p>
      <p class="legend" id="gLegend"></p>
    </div>
    <div id="gnotice" hidden class="notice"></div>
    <table class="plan" id="plan"></table>
    <div id="gNext"></div>
  </section>

  <section class="card" id="bcard" hidden>
    <div class="chead">
      <h3 id="bTitle">Brands the AI Overview names</h3>
      <p class="sub" id="bSub"></p>
    </div>
    <div id="brands"></div>
    <div id="bNext"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script type="application/json" id="qe-data">
{"meta":{"seed":"","country":"","language":"","device":"Desktop","date":"","creditsUsed":0,"searchesRun":0,"questionsFound":0,"repeatedSkipped":0},"tree":{"q":"","aio":"absent","paa":[]}}
</script>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('qe-data').textContent);
  var META = DATA.meta;
  var AIO_ON = META.aioIncluded !== false, BRANDS_ON = META.brandsIncluded !== false && AIO_ON;
  var PLAN = META.plan || 'current';

    if (AIO_ON && BRANDS_ON) s.push(OTHERS.length + ' brands named' + (BRANDS.some(function (b) { return b.own; }) ? ' besides ' + BRANDS.filter(function (b) { return b.own; }).map(function (b) { return b.name; }).join(', ') : ''));
    document.getElementById('stats').textContent = s.join('  ·  ');
    document.getElementById('treeLegend').textContent = (AIO_ON ? 'AIO: Google answered the question with an AI Overview. ' : '') + 'The number on a row is how many questions sit under it. Grey questions were found but not searched.';
    document.getElementById('foot').textContent = (META.repeatedSkipped || 0) + ' repeated questions skipped. ' + (META.headingsDropped || 0) + ' page headings dropped (first-person, page furniture). Approximate credits, one per search.';
  }
  function render() {
    header();
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function (b) { var on = b.getAttribute('data-v') === view; b.className = on ? 'on' : ''; b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    document.getElementById('split').hidden = view !== 'tree';
    document.getElementById('acard').hidden = view !== 'all';
    document.getElementById('gcard').hidden = view !== 'groups';
    document.getElementById('bcard').hidden = view !== 'brands';
    document.getElementById('expand').hidden = view !== 'tree';
    document.getElementById('collapse').hidden = view !== 'tree';
    if (view === 'tree') { document.getElementById('split').className = 'split' + (SEL ? ' has-sel' : ''); panelEl(); }
    if (view === 'all') renderAll();
    if (view === 'groups') renderGroups();
    if (view === 'brands') renderBrands();
  }
  render();
})();
</script>
</body>
</html>
